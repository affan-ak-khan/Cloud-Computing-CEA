name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

env:
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        working-directory: api
        run: npm ci

      - name: Run tests
        working-directory: api
        run: npm test

  build_and_push:
    needs: test
    # Build and publish only on pushes to main, not on pull requests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Registry names must be lowercase
      - name: Set lowercase owner
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: ./api
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/ctm-api:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/ctm-api:latest

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: ./web
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/ctm-web:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/ctm-web:latest

  deploy:
    needs: build_and_push
    # Runs only after the AWS variables are configured (after terraform apply)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AWS_ROLE_ARN != ''
    runs-on: ubuntu-latest
    concurrency: deploy
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ap-south-1
    steps:
      - name: Debug OIDC claims
        run: |
              TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
              echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+' | awk '{ while (length($0) % 4) $0 = $0 "="; print }' | base64 -d | jq '{sub, aud, repository, ref, event_name, actor}'
      - name: Configure AWS credentials (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Record the image tag to deploy
        run: |
          aws ssm put-parameter --name /ctm/image_tag --type String \
            --value "${{ github.sha }}" --overwrite

      - name: Run the deploy script on the instances
        id: send
        run: |
          CMD_ID=$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --targets "Key=tag:app,Values=ctm" \
            --parameters 'commands=["/opt/ctm/deploy.sh"]' \
            --comment "deploy ${GITHUB_SHA}" \
            --query Command.CommandId --output text)
          echo "command_id=$CMD_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for every instance to finish
        run: |
          CMD_ID="${{ steps.send.outputs.command_id }}"
          sleep 10
          IDS=$(aws ssm list-command-invocations --command-id "$CMD_ID" \
            --query 'CommandInvocations[].InstanceId' --output text)
          if [ -z "$IDS" ]; then echo "No instances received the command"; exit 1; fi
          for ID in $IDS; do
            aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "$ID"
          done

      - name: Health check through the load balancer
        run: |
          BASE="http://${{ vars.ALB_DNS_NAME }}"
          for i in $(seq 1 20); do
            H=$(curl -s -o /dev/null -w '%{http_code}' "$BASE/health" || true)
            A=$(curl -s -o /dev/null -w '%{http_code}' "$BASE/api/tasks" || true)
            echo "health=$H api=$A"
            if [ "$H" = "200" ] && [ "$A" = "200" ]; then exit 0; fi
            sleep 10
          done
          echo "Health check failed"
          exit 1
