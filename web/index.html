<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cloud Task</title>
<style>
:root {
  --bg1: #eef2ff; --bg2: #f8fafc;
  --card: #ffffff; --text: #0f172a; --muted: #64748b; --line: #e8ecf3;
  --primary: #4f46e5; --primary-600: #4338ca; --primary-soft: #eef0ff;
  --danger: #e11d48; --danger-soft: #fff1f3;
  --shadow: 0 10px 40px -12px rgba(30, 41, 99, .18), 0 2px 6px rgba(15, 23, 42, .05);
}
* { box-sizing: border-box; margin: 0; }
body {
  min-height: 100vh; display: flex; justify-content: center; align-items: flex-start;
  padding: 56px 16px; color: var(--text);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  background: linear-gradient(160deg, var(--bg1), var(--bg2));
}
.card {
  width: 100%; max-width: 620px; background: var(--card);
  border-radius: 22px; box-shadow: var(--shadow); padding: 28px;
}
header { display: flex; align-items: center; gap: 14px; margin-bottom: 22px; }
.logo {
  width: 44px; height: 44px; border-radius: 13px; display: grid; place-items: center;
  background: linear-gradient(135deg, #6366f1, #8b5cf6); color: #fff;
}
h1 { font-size: 1.35rem; letter-spacing: -.02em; }
.sub { color: var(--muted); font-size: .85rem; margin-top: 2px; }
.sub.error { color: var(--danger); }

.progress { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; margin-bottom: 22px; }
.progress > div { height: 100%; width: 0; background: linear-gradient(90deg, #6366f1, #8b5cf6); transition: width .4s ease; }

form { display: flex; gap: 10px; }
input[type=text] {
  flex: 1; min-width: 0; padding: 14px 16px; font: inherit; color: var(--text);
  background: var(--bg2); border: 1.5px solid var(--line); border-radius: 13px; outline: none;
  transition: border-color .15s, box-shadow .15s, background .15s;
}
input[type=text]::placeholder { color: var(--muted); }
input[type=text]:focus { border-color: var(--primary); background: var(--card); box-shadow: 0 0 0 4px var(--primary-soft); }
.btn-add {
  padding: 0 20px; border: 0; border-radius: 13px; font: inherit; font-weight: 600; cursor: pointer;
  color: #fff; background: var(--primary); display: flex; align-items: center; gap: 6px;
  transition: background .15s, transform .1s;
}
.btn-add:hover { background: var(--primary-600); }
.btn-add:active { transform: scale(.97); }
.btn-add:disabled { opacity: .6; cursor: not-allowed; }

.filters { display: flex; gap: 4px; padding: 4px; margin: 20px 0 8px; background: var(--bg2); border-radius: 13px; }
.filters button {
  flex: 1; padding: 9px 12px; border: 0; border-radius: 10px; background: transparent; cursor: pointer;
  font: inherit; font-size: .9rem; font-weight: 500; color: var(--muted); transition: all .15s;
}
.filters button:hover { color: var(--text); }
.filters button.active { background: var(--card); color: var(--primary); box-shadow: 0 1px 4px rgba(15,23,42,.1); }
.filters .count {
  display: inline-block; min-width: 20px; margin-left: 6px; padding: 1px 6px; border-radius: 99px;
  font-size: .75rem; background: var(--line); color: var(--muted);
}
.filters button.active .count { background: var(--primary-soft); color: var(--primary); }

ul { list-style: none; padding: 0; }
li {
  display: flex; align-items: center; gap: 14px; padding: 14px 8px; border-bottom: 1px solid var(--line);
}
li.new { animation: in .25s ease; }
li:last-child { border-bottom: 0; }
@keyframes in { from { opacity: 0; transform: translateY(-6px); } }

.check { position: relative; width: 22px; height: 22px; flex: none; }
.check input { position: absolute; inset: 0; opacity: 0; cursor: pointer; margin: 0; }
.check span {
  position: absolute; inset: 0; border: 2px solid #cbd5e1; border-radius: 7px; transition: all .15s;
  display: grid; place-items: center;
}
.check span svg { width: 13px; height: 13px; stroke: #fff; opacity: 0; transform: scale(.6); transition: all .15s; }
.check input:checked + span { background: var(--primary); border-color: var(--primary); }
.check input:checked + span svg { opacity: 1; transform: scale(1); }
.check input:focus-visible + span { box-shadow: 0 0 0 4px var(--primary-soft); }

.title { flex: 1; word-break: break-word; line-height: 1.4; transition: color .2s; }
li.done .title { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--muted); }

.del {
  border: 0; background: transparent; color: var(--muted); width: 34px; height: 34px; border-radius: 10px;
  cursor: pointer; display: grid; place-items: center; opacity: 0; transition: all .15s;
}
li:hover .del, .del:focus-visible { opacity: 1; }
.del:hover { background: var(--danger-soft); color: var(--danger); }
@media (hover: none) { .del { opacity: 1; } }

.empty { text-align: center; padding: 38px 0 22px; color: var(--muted); }
.empty svg { width: 52px; height: 52px; margin-bottom: 10px; opacity: .55; }
.empty b { display: block; color: var(--text); margin-bottom: 4px; }

footer { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; font-size: .85rem; color: var(--muted); }
footer button { border: 0; background: none; color: var(--muted); font: inherit; cursor: pointer; }
footer button:hover { color: var(--danger); }
</style>
</head>
<body>
<main class="card">
  <header>
    <div class="logo">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19H9a7 7 0 1 1 6.7-9h1.8a4.5 4.5 0 1 1 0 9Z"/></svg>
    </div>
    <div>
      <h1>Cloud Task Manager</h1>
      <p class="sub" id="summary" role="status" aria-live="polite">Loading…</p>
    </div>
  </header>

  <div class="progress"><div id="bar"></div></div>

  <form id="form">
    <input type="text" id="input" placeholder="What needs doing?" maxlength="200" autocomplete="off" autofocus required>
    <button class="btn-add" type="submit">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      Add
    </button>
  </form>

  <nav class="filters" id="filters">
    <button type="button" data-f="all" class="active">All<span class="count" id="c-all">0</span></button>
    <button type="button" data-f="active">Active<span class="count" id="c-active">0</span></button>
    <button type="button" data-f="done">Done<span class="count" id="c-done">0</span></button>
  </nav>

  <ul id="list"></ul>

  <footer>
    <span id="left"></span>
    <button id="clear" type="button">Clear completed</button>
  </footer>
</main>
<script>
// Relative URL: nginx proxies /api to the API container
async function request(path, options = {}) {
  const res = await fetch(`/api/tasks${path}`, {
    headers: { 'Content-Type': 'application/json' },
    ...options,
  });
  if (res.status === 204) return null;
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
  return data;
}

const api = {
  list: () => request(''),
  add: (title) => request('', { method: 'POST', body: JSON.stringify({ title }) }),
  toggle: (id, completed) => request(`/${id}`, { method: 'PATCH', body: JSON.stringify({ completed }) }),
  remove: (id) => request(`/${id}`, { method: 'DELETE' }),
};

let tasks = [], filter = 'all', lastAdded = null;
const $ = (id) => document.getElementById(id);
// Task titles are user input: always escape before putting them in innerHTML
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function showError(message) {
  $('summary').textContent = message;
  $('summary').classList.add('error');
}

function render() {
  const done = tasks.filter((t) => t.completed).length, active = tasks.length - done;
  $('c-all').textContent = tasks.length; $('c-active').textContent = active; $('c-done').textContent = done;
  $('bar').style.width = tasks.length ? (done / tasks.length * 100) + '%' : '0';
  $('summary').classList.remove('error');
  $('summary').textContent = tasks.length ? `${done} of ${tasks.length} tasks completed` : 'Nothing here yet';
  $('left').textContent = `${active} task${active === 1 ? '' : 's'} left`;
  $('clear').style.visibility = done ? 'visible' : 'hidden';

  const shown = tasks.filter((t) => filter === 'all' || (filter === 'done') === t.completed);
  if (!shown.length) {
    const msg = { all: ['No tasks yet', 'Add your first task above.'], active: ['All caught up 🎉', 'No active tasks.'], done: ['Nothing completed', 'Finished tasks show up here.'] }[filter];
    $('list').innerHTML = `<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 8h8M8 12h8M8 16h4"/></svg><b>${msg[0]}</b>${msg[1]}</div>`;
    return;
  }
  $('list').innerHTML = shown.map((t) => `
    <li class="${t.completed ? 'done' : ''}${t.id === lastAdded ? ' new' : ''}" data-id="${esc(t.id)}">
      <label class="check">
        <input type="checkbox" ${t.completed ? 'checked' : ''} aria-label="Mark done">
        <span><svg viewBox="0 0 24 24" fill="none" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
      </label>
      <span class="title">${esc(t.title)}</span>
      <button class="del" type="button" aria-label="Delete task" title="Delete">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v5M14 11v5"/></svg>
      </button>
    </li>`).join('');
}

$('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const title = $('input').value.trim();
  if (!title) return;
  const button = e.target.querySelector('button');
  button.disabled = true;
  try {
    const x = await api.add(title);
    $('input').value = '';
    // API lists newest first, so new tasks go on top
    lastAdded = x.id; tasks.unshift(x);
    render(); lastAdded = null;
  } catch (err) {
    showError(err.message);
  } finally {
    button.disabled = false;
  }
});

$('list').addEventListener('click', async (e) => {
  const li = e.target.closest('li'); if (!li) return;
  const t = tasks.find((x) => String(x.id) === li.dataset.id); if (!t) return;
  try {
    if (e.target.closest('.del')) {
      await api.remove(t.id); tasks = tasks.filter((x) => x !== t); render();
    } else if (e.target.matches('input[type=checkbox]')) {
      const completed = e.target.checked;
      await api.toggle(t.id, completed); t.completed = completed; render();
    }
  } catch (err) {
    if (e.target.matches('input[type=checkbox]')) e.target.checked = t.completed;
    showError(err.message);
  }
});

$('filters').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  filter = b.dataset.f;
  document.querySelectorAll('#filters button').forEach((x) => x.classList.toggle('active', x === b));
  render();
});

// No bulk endpoint: delete each completed task individually
$('clear').addEventListener('click', async () => {
  const doneTasks = tasks.filter((t) => t.completed);
  const results = await Promise.allSettled(doneTasks.map((t) => api.remove(t.id)));
  const removed = new Set(doneTasks.filter((_, i) => results[i].status === 'fulfilled'));
  tasks = tasks.filter((t) => !removed.has(t));
  render();
  if (removed.size < doneTasks.length) showError('Some tasks could not be deleted.');
});

api.list()
  .then((t) => { tasks = t; render(); })
  .catch((err) => showError(`Could not load tasks: ${err.message}`));
</script>
</body>
</html>
