<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cloud Task Manager v3</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<main class="card">
  <header>
    <div class="logo">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19H9a7 7 0 1 1 6.7-9h1.8a4.5 4.5 0 1 1 0 9Z"/></svg>
    </div>
    <div>
      <h1>Cloud Task Manager</h1>
      <p class="sub" id="summary" role="status" aria-live="polite">Loading…</p>
    </div>
  </header>

  <div class="progress"><div id="bar"></div></div>

  <form id="form">
    <input type="text" id="input" placeholder="What needs doing?" maxlength="200" autocomplete="off" autofocus required>
    <button class="btn-add" type="submit">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      Add
    </button>
  </form>

  <nav class="filters" id="filters">
    <button type="button" data-f="all" class="active">All<span class="count" id="c-all">0</span></button>
    <button type="button" data-f="active">Active<span class="count" id="c-active">0</span></button>
    <button type="button" data-f="done">Done<span class="count" id="c-done">0</span></button>
  </nav>

  <ul id="list"></ul>

  <footer>
    <span id="left"></span>
    <button id="clear" type="button">Clear completed</button>
  </footer>
</main>
<script src="app.js"></script>
</body>
</html>
